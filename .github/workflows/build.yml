name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # FoundationModels needs the macOS 26 SDK.
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Package app
        run: |
          mkdir -p dist
          cp -r Culturify.app dist/
          # Remove quarantine attributes
          xattr -cr dist/Culturify.app
          # Create zip preserving permissions
          cd dist
          ditto -c -k --keepParent Culturify.app Culturify.app.zip

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Culturify.app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Culturify-${{ steps.version.outputs.version }}
          path: dist/Culturify.app.zip
          retention-days: 90
